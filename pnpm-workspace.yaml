packages:
  - '.'

# Security version pins (moved from package.json#pnpm — pnpm 10+ reads settings here)
overrides:
  defu: '>=6.1.5'
  hono: '>=4.12.18'
  '@hono/node-server': '>=1.19.13'
  lodash: '>=4.18.0'
  postcss: '>=8.5.10'
  ajv: '>=6.14.0'
  minimatch: '>=9.0.7'
  flatted: '>=3.4.2'
  picomatch: '>=4.0.4'
  brace-expansion: '>=2.0.3'

# Allow native/postinstall scripts required at runtime (pnpm 10 blocks others by default)
onlyBuiltDependencies:
  - '@prisma/engines'
  - bcrypt
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
